services:
  db:
    image: postgres:16
    container_name: alzheicare-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alzheicare_db
    ports:
      - "51214:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: