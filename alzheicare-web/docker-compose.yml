services:
  db:
    image: postgres:16
    container_name: alzheicare-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "51214:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: